name: Release Windows x64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: '0'
  APP_VERSION: '1.0.0'

jobs:
  build-windows:
    name: Build & Package MediaPulse (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI v2
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch FFmpeg & FFprobe Windows x64 binaries
        run: powershell -ExecutionPolicy Bypass -File .\scripts\fetch-ffmpeg.ps1

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Go test suite (CGO_ENABLED=0)
        run: go test -count=1 ./...

      - name: Build native MediaPulse.exe (no UPX)
        run: wails build -clean -s -ldflags "-s -w"

      - name: Copy FFmpeg binaries alongside MediaPulse.exe
        run: |
          $binOut = Join-Path $PWD "build\bin\bin"
          New-Item -ItemType Directory -Force -Path $binOut | Out-Null
          Copy-Item "build\ffmpeg\ffmpeg.exe" (Join-Path $binOut "ffmpeg.exe") -Force
          Copy-Item "build\ffmpeg\ffprobe.exe" (Join-Path $binOut "ffprobe.exe") -Force

      - name: Optional Windows Authenticode signing (when certificate secret is set)
        env:
          SIGNING_CERT_PFX: ${{ secrets.WINDOWS_SIGNING_CERT_PFX }}
          SIGNING_CERT_PASS: ${{ secrets.WINDOWS_SIGNING_CERT_PASS }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PFX)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERT_PFX))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
            if ($signtool) {
              & $signtool sign /f $pfxPath /p $env:SIGNING_CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "build\bin\MediaPulse.exe"
            }
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          } else {
            Write-Host "No signing secret configured; skipping Authenticode step."
          }

      - name: Ensure Inno Setup is available
        run: |
          $iscc = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
          }

      - name: Package portable ZIP, Inno Setup installer, and SHA256SUMS
        run: |
          $tagVersion = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $env:APP_VERSION
          }

          $releaseDir = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $exePath = Join-Path $PWD "build\bin\MediaPulse.exe"
          $binOutDir = Join-Path $PWD "build\bin\bin"
          if (-not (Test-Path $exePath)) { throw "MediaPulse.exe not found" }

          $readmePath = Join-Path $releaseDir "LEEME.txt"
          @"
          MediaPulse v$tagVersion - Portable & Installer Windows x64
          ===========================================================

          100% Local-First · 0% Telemetria · FFmpeg incluido · Aceleracion GPU NVENC.
          "@ | Set-Content -Path $readmePath -Encoding UTF8

          $stageDir = Join-Path $releaseDir "_stage_portable"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stageDir "bin") | Out-Null
          Copy-Item $exePath (Join-Path $stageDir "MediaPulse.exe")
          Copy-Item (Join-Path $binOutDir "ffmpeg.exe") (Join-Path $stageDir "bin\ffmpeg.exe")
          Copy-Item (Join-Path $binOutDir "ffprobe.exe") (Join-Path $stageDir "bin\ffprobe.exe")
          Copy-Item $readmePath (Join-Path $stageDir "LEEME.txt")

          $zipName = "MediaPulse-v$tagVersion-win64-portable.zip"
          $zipPath = Join-Path $releaseDir $zipName
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Remove-Item -Recurse -Force $stageDir

          $iscc = @(
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }

          & $iscc "/DMyAppVersion=$tagVersion" "build\windows\installer\mediapulse-inno.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

          $setupName = "MediaPulse-v$tagVersion-Setup.exe"
          $setupPath = Join-Path $releaseDir $setupName
          if (-not (Test-Path $setupPath)) { throw "$setupName not found" }

          $artifacts = @(
            @{ Path = $exePath; Name = "MediaPulse.exe" },
            @{ Path = $zipPath; Name = $zipName },
            @{ Path = $setupPath; Name = $setupName }
          )
          $sums = foreach ($a in $artifacts) {
            $hash = (Get-FileHash -Path $a.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($a.Name)"
          }
          $sums | Set-Content -Path (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ASCII

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mediapulse-windows-x64
          path: |
            release/MediaPulse-v*-win64-portable.zip
            release/MediaPulse-v*-Setup.exe
            release/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/MediaPulse-v*-win64-portable.zip
            release/MediaPulse-v*-Setup.exe
            release/SHA256SUMS.txt
          generate_release_notes: true
          overwrite_files: true
